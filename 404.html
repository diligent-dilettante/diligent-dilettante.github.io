<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Found | Sri Krishna Ravavarapu</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root { --bg: #ffffff; --text: #1b1b1d; --muted: #5c5f66; --accent: #0a5fa8; font-size: 18px; }
    [data-theme="dark"] { --bg: #121316; --text: #eceef1; --muted: #9ba1aa; --accent: #7cbcff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, serif;
      line-height: 1.7; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .box { max-width: 460px; }
    h1 { font-size: clamp(1.6rem, 6vw, 2rem); font-weight: 400; margin-bottom: 0.75rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Typesetting. The browser ships most of this now; no library needed.
       balance keeps headings off a one-word last line, pretty does the same
       for paragraphs, and hanging punctuation pulls quotes into the margin. */
    h1, h2, h3 { text-wrap: balance; }
    p, li, .tldr, .sub { text-wrap: pretty; }
    body { hanging-punctuation: first last; font-optical-sizing: auto; }

    /* Anchored headings land below the fold edge, not flush against it. */
    h2, h3, section[id] { scroll-margin-top: 2rem; }

    /* Reading progress. One hairline, accent colour, no chrome around it. */
    .progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0;
      background: var(--accent); z-index: 10;
      transition: width 0.1s linear;
    }
    @media (prefers-reduced-motion: reduce) { .progress { transition: none; } }

    /* Heading anchors. Invisible until you want them. */
    .anchor {
      float: left; margin-left: -1.1em; padding-right: 0.35em;
      color: var(--muted); opacity: 0; text-decoration: none;
      font-weight: 400; letter-spacing: 0;
    }
    h2:hover .anchor, h3:hover .anchor, .anchor:focus-visible { opacity: 0.55; }
    .anchor:hover { opacity: 1; text-decoration: none; }
    @media (max-width: 700px) { .anchor { display: none; } }

    @media print {
      nav, .theme-switch, .clock, .progress, .anchor, .back { display: none; }
      body { background: #fff; color: #000; font-size: 11pt; line-height: 1.5; }
      .page { max-width: none; padding: 0; }
      a { color: #000; text-decoration: underline; }
      /* Print the destination, since a printed link is otherwise useless. */
      article a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; word-break: break-all; }
      h2, h3 { break-after: avoid; }
      pre, .tldr { break-inside: avoid; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>nothing here</h1>
    <p>this page doesn't exist, or it moved.</p>
    <p><a href="/">back home</a></p>
  </div>
</body>
</html>
